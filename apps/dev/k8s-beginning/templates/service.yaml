{{- $root := . -}}
{{- range $index, $component := .Values.components }}
{{- if $component.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "k8s-beginning.fullname" $root }}-{{ $component.name }}
spec:
    selector:
        app: {{ include "k8s-beginning.name" $root }}-{{ $component.name }}
    type: {{ $component.service.type }}
    ports:
        - name: http
          port: {{ $component.service.httpPort }}
          targetPort: http
        - name: grpc
          port: {{ $component.service.grpcPort }}
          targetPort: grpc
{{- end }}
{{- end }}
