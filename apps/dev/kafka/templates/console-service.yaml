apiVersion: v1
kind: Service
metadata:
  name: kafka-console
spec:
  type: {{ .Values.console.service.type }}
  ports:
  - port: {{ .Values.console.service.port }}
    targetPort: http
    {{- if eq .Values.console.service.type "NodePort" }}
    nodePort: {{ .Values.console.service.nodePort }}
    {{- end }}
    name: http
  selector:
    app: kafka-console
