apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-console
  template:
    metadata:
      labels:
        app: kafka-console
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox
        command: ['sh', '-c', 'until nc -z kafka.{{ .Release.Namespace }}.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
      - name: console
        image: "{{ .Values.console.image }}:{{ .Values.console.tag }}"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BROKERS
          value: "kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
