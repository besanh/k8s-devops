image:
  repository: redis
  tag: 7.2-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 6379

replicaCount: 1

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

redis:
  password: "redis_password_123"
  appendonly: true

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

password: "[PASSWORD]"
